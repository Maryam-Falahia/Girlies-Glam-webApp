[build]
  command = "pnpm --filter @workspace/api-server run build && PORT=8080 BASE_PATH=/ pnpm --filter @workspace/girlies-glam run build"
  publish = "artifacts/girlies-glam/dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.15.9"
  NODE_ENV = "production"

[functions]
  directory = "netlify/functions"
  node_bundler = "none"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
