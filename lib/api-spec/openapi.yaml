openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Girlies Glam API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: products
    description: Product catalogue
  - name: orders
    description: Orders
  - name: wishlist
    description: Wishlist
  - name: checkout
    description: Stripe checkout

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ───────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "200":
          description: Registered and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ─── PRODUCTS ────────────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products with optional filters
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price_asc, price_desc, rating]
        - name: onSale
          in: query
          schema:
            type: boolean
        - name: isNew
          in: query
          schema:
            type: boolean
        - name: isBestseller
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  total:
                    type: integer
                required: [products, total]

  /products/featured:
    get:
      operationId: getFeaturedProducts
      tags: [products]
      summary: Get bestsellers and new arrivals for the home page
      responses:
        "200":
          description: Featured product collections
          content:
            application/json:
              schema:
                type: object
                properties:
                  bestsellers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  newArrivals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                required: [bestsellers, newArrivals]

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a single product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ─── WISHLIST ────────────────────────────────────────────────────
  /wishlist:
    get:
      operationId: getWishlist
      tags: [wishlist]
      summary: Get authenticated user's wishlist
      responses:
        "200":
          description: Wishlist product IDs
          content:
            application/json:
              schema:
                type: object
                properties:
                  productIds:
                    type: array
                    items:
                      type: string
                required: [productIds]
    post:
      operationId: addToWishlist
      tags: [wishlist]
      summary: Add a product to wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WishlistInput"
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  /wishlist/{productId}:
    delete:
      operationId: removeFromWishlist
      tags: [wishlist]
      summary: Remove a product from wishlist
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  # ─── ORDERS ──────────────────────────────────────────────────────
  /discounts/validate:
    post:
      operationId: validateDiscount
      tags: [discounts]
      summary: Validate a promo code against checkout items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountValidationInput"
      responses:
        "200":
          description: Promo code validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountValidationResult"

  /admin/discounts:
    get:
      operationId: listDiscounts
      tags: [discounts]
      summary: List promo codes for administrators
      responses:
        "200":
          description: Discount codes and available categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  discounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiscountCode"
                  categories:
                    type: array
                    items:
                      type: string
                required: [discounts, categories]
    post:
      operationId: createDiscount
      tags: [discounts]
      summary: Create a promo code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountCodeInput"
      responses:
        "201":
          description: Created promo code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountCode"

  /admin/discounts/{id}:
    patch:
      operationId: updateDiscount
      tags: [discounts]
      summary: Update a promo code
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountCodeUpdate"
      responses:
        "200":
          description: Updated promo code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscountCode"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List authenticated user's orders
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                required: [orders]
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order after successful payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "200":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get a single order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ─── CHECKOUT / STRIPE ───────────────────────────────────────────
  /checkout/payment-intent:
    post:
      operationId: createPaymentIntent
      tags: [checkout]
      summary: Create a Stripe PaymentIntent (supports Apple Pay / Google Pay)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentIntentInput"
      responses:
        "200":
          description: Client secret for Stripe.js
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientSecret:
                    type: string
                  publishableKey:
                    type: string
                required: [clientSecret, publishableKey]

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    # ─── AUTH ───────────────────────────────────────────────────────
    RegisterInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
          minLength: 6
      required: [name, email, password]

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        initials:
          type: string
      required: [id, name, email, initials]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]

    # ─── PRODUCT ────────────────────────────────────────────────────
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        price:
          type: number
        compareAt:
          type: number
          nullable: true
        colorway:
          type: string
        swatch:
          type: string
        sizes:
          type: array
          items:
            type: string
        isNew:
          type: boolean
        isBestseller:
          type: boolean
        rating:
          type: number
        reviews:
          type: integer
        description:
          type: string
        imageUrl:
          type: string
          nullable: true
      required: [id, name, category, price, colorway, swatch, sizes, isNew, isBestseller, rating, reviews, description]

    # ─── ORDER ──────────────────────────────────────────────────────
    OrderItem:
      type: object
      properties:
        name:
          type: string
        colorway:
          type: string
        size:
          type: string
        qty:
          type: integer
        price:
          type: number
      required: [name, size, qty, price]

    Order:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total:
          type: number
        status:
          type: string
          enum: [Submitted, In Process, Packed, In Delivery, Received]
        shippingName:
          type: string
        shippingAddress:
          type: string
        phone:
          type: string
        governorate:
          type: string
        wilayat:
          type: string
        postalCode:
          type: string
        transferReceiptAvailable:
          type: boolean
        language:
          type: string
          enum: [en, ar]
        promoCode:
          type: ["string", "null"]
        discountAmount:
          type: number
        paymentIntentId:
          type: string
          nullable: true
      required: [id, date, items, total, status, shippingName, shippingAddress, phone, governorate, wilayat, postalCode, transferReceiptAvailable, language, discountAmount]

    CreateOrderInput:
      type: object
      properties:
        lines:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              colorway:
                type: string
              size:
                type: string
              qty:
                type: integer
            required: [productId, size, qty]
        shippingName:
          type: string
        phone:
          type: string
          pattern: '^[+]968 [0-9]{8}$'
        governorate:
          type: string
        wilayat:
          type: string
        postalCode:
          type: string
        language:
          type: string
          enum: [en, ar]
        paymentIntentId:
          type: string
        transferReceipt:
          type: string
          minLength: 1
        promoCode:
          type: string
      required: [lines, shippingName, phone, governorate, wilayat, postalCode, language, paymentIntentId, transferReceipt]

    DiscountCode:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        percentage:
          type: integer
        categories:
          type: array
          items:
            type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        isEnabled:
          type: boolean
        status:
          type: string
          enum: [Scheduled, Active, Expired, Disabled]
        createdAt:
          type: string
          format: date-time
      required: [id, code, percentage, categories, startsAt, endsAt, isEnabled, status, createdAt]

    DiscountCodeInput:
      type: object
      properties:
        code:
          type: string
        percentage:
          type: integer
          minimum: 1
          maximum: 100
        categories:
          type: array
          minItems: 1
          items:
            type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        isEnabled:
          type: boolean
      required: [code, percentage, categories, startsAt, endsAt, isEnabled]

    DiscountCodeUpdate:
      type: object
      properties:
        code:
          type: string
        percentage:
          type: integer
          minimum: 1
          maximum: 100
        categories:
          type: array
          minItems: 1
          items:
            type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        isEnabled:
          type: boolean

    DiscountValidationInput:
      type: object
      properties:
        code:
          type: string
        lines:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              productId:
                type: string
              qty:
                type: integer
                minimum: 1
            required: [productId, qty]
      required: [code, lines]

    DiscountValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        message:
          type: string
        code:
          type: string
        percentage:
          type: integer
        eligibleSubtotal:
          type: number
        discountAmount:
          type: number
      required: [valid, message]

    WishlistInput:
      type: object
      properties:
        productId:
          type: string
      required: [productId]

    # ─── CHECKOUT ───────────────────────────────────────────────────
    PaymentIntentInput:
      type: object
      properties:
        amountCents:
          type: integer
          description: Amount in cents (e.g. 2999 for $29.99)
        currency:
          type: string
          default: usd
      required: [amountCents]
